<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlobalVision | Broadband & Cable TV Subscriber Manager</title>
  <meta name="description" content="Track subscriber renewals, expirations, and disconnections for your broadband and cable TV business." />
  <meta name="theme-color" content="#f6f7fb" />

  <!-- Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- ═══ Login Screen ═══ -->
    <div id="login-screen" class="view">
      <!-- Rendered by auth.js -->
    </div>

    <!-- ═══ Main Application ═══ -->
    <div id="main-app" class="hidden">
      <!-- Sidebar (desktop) -->
      <aside id="sidebar"></aside>

      <!-- Content Area -->
      <main id="content">
        <!-- Top App Bar -->
        <header id="top-bar">
          <div class="top-bar-left">
            <div class="network-badge">
              <span class="live-dot"></span>
              <span class="live-text">GlobalVision Network Active</span>
            </div>
          </div>
          <div class="top-bar-right">
            <!-- Global Search Trigger (Cmd+K) -->
            <button id="top-search-btn" class="topbar-search-btn" title="Quick Search (Press Cmd+K or /)" aria-label="Search">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <span class="search-placeholder-text">Search...</span>
              <kbd class="search-kbd-hint">⌘K</kbd>
            </button>

            <!-- Theme Toggle (Dark / Light) -->
            <button id="theme-toggle-btn" class="topbar-icon-btn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
              <span class="theme-icon-slot"></span>
            </button>

            <div id="quick-alert-pill" class="quick-alert-pill hidden"></div>
            <button id="global-add-btn" class="btn btn-sm btn-primary">
              <span class="btn-icon">+</span>
              <span class="btn-label">New Connection</span>
            </button>
            <button id="topbar-logout-btn" class="btn btn-sm topbar-logout-btn" title="Sign Out" aria-label="Sign Out">
              <span class="btn-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                  <polyline points="16 17 21 12 16 7"/>
                  <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
              </span>
              <span class="topbar-logout-text">Sign Out</span>
            </button>
          </div>
        </header>

        <section id="dashboard-view" class="view"></section>
        <section id="billing-view" class="view hidden"></section>
        <section id="connections-view" class="view hidden"></section>
        <section id="logs-view" class="view hidden"></section>
        <section id="settings-view" class="view hidden"></section>
      </main>

      <!-- Mobile Bottom Nav -->
      <nav id="mobile-nav"></nav>
    </div>

    <!-- ═══ Modal & Drawer Overlays ═══ -->
    <div id="connection-modal" class="modal hidden"></div>
    <div id="billing-modal" class="modal hidden"></div>
    <div id="sql-modal" class="modal hidden"></div>
    <div id="quick-search-modal" class="modal hidden"></div>
    <div id="customer-drawer" class="customer-drawer-overlay hidden"></div>

    <!-- ═══ Toast Notifications ═══ -->
    <div id="toast-container"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
